name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production Standard OPS-1/OPS-2: fail on known high-severity vulnerabilities in shipped deps.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Production Standard DB-2/DB-6: migrations apply cleanly on the Postgres that
  # Railway runs, twice (the second run is a no-op), and the least-privilege app
  # role can run the app's queries but no DDL, cannot make an admin, and cannot
  # write across owners.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spotter
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotter
      APP_DATABASE_URL: postgresql://app_rw_login:ci-app-password@localhost:5432/spotter
      APP_DB_PASSWORD: ci-app-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run migrate
      - run: node scripts/check-app-role.mjs
      # API-1: every route that takes an id, as another account, against the real database.
      - run: npm run test:db
        env:
          DATABASE_URL: postgresql://app_rw_login:ci-app-password@localhost:5432/spotter
